[project]
name = "international-delivery-service"
version = "0.1.0"
description = ""
authors = [
    { name = "sgavrilenko", email = "sgavrilenko@marfa-tech.com" }
]
readme = "README.md"
requires-python = ">=3.11,<4.0"

dependencies = [
    "fastapi>=0.115.2,<0.116.0",
    "uvicorn[standard]>=0.34.2,<0.35.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "sqlalchemy[asyncio] (>=2.0.40,<3.0.0)",
    "alembic>=1.15.2,<2.0.0",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "redis[async] (>=6.0.0,<7.0.0)",
    "celery (>=5.5.2,<6.0.0)",
    "asgiref (>=3.8.1,<4.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "fakeredis (>=2.29.0,<3.0.0)",
    "respx (>=0.22.0,<0.23.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pika (>=1.3.2,<2.0.0)",
    "pymongo (>=4.12.1,<5.0.0)"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11.8,<1.0.0",
  "pre-commit>=4.2.0,<5.0.0",
  "pytest>=8.3.5,<9.0.0",
  "httpx>=0.28.1,<0.29.0"
]

[project.scripts]
dev = "uvicorn src.main:app --reload"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry.group.dev.dependencies]
alembic = "^1.15.2"
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
pytest-cov = "^6.1.1"
httpx = "^0.28.1"
black = "^25.1.0"
ruff = "^0.11.8"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["src/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"